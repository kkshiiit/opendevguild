name: Validate library
on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]
permissions:
  contents: read
env:
  PYTHONUTF8: '1'
concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    if: github.event_name != 'release'
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.11'
          - os: ubuntu-latest
            python: '3.12'
          - os: windows-latest
            python: '3.12'
          - os: macos-latest
            python: '3.12'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install pinned tooling
        run: python -m pip install uv==0.13.5
      - name: Resolve locked environment
        run: uv sync --frozen
      - name: Lint fatal Python errors
        run: uv run --frozen ruff check --select E9,F63,F7,F82 scripts tests
      - name: Validate official format and local policy
        run: uv run --frozen python scripts/guild.py validate
      - name: Validate inspected visual library
        run: uv run --frozen python scripts/visual.py validate
      - name: Exercise tooling and negative cases
        run: uv run --frozen python -m unittest discover -s tests -v
      - name: Check example evidence contract
        run: uv run --frozen python scripts/guild.py check-handoff examples/handoff.json --task examples/task.json
      - name: Check conservative public-source policy
        run: uv run --frozen python scripts/audit.py
      - name: Audit installed locked dependencies
        run: uv run --frozen pip-audit --local --progress-spinner off --timeout 15
  visual:
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.13.5
      - run: uv sync --frozen --group visual
      - run: uv run --frozen pip-audit --local --progress-spinner off --timeout 15
      - run: uv run --frozen playwright install --with-deps chromium ffmpeg
      - run: uv run --frozen python -m unittest discover -s tests -p test_visual.py -v
      - run: uv run --frozen python scripts/capture_visual.py --output dist/ci-visual
  release-integrity:
    if: github.event_name == 'release'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      ODG_RELEASE_TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python scripts/verify_release.py --output release-verification
